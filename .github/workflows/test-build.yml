name: Turnip test build

# Test builds of the Azimuth Turnip (another Mesa commit, Armada base patches
# left out), packaged as azimuth-VARIANT/ so they can be compared with the
# release driver on the device. Manual runs take the inputs below; a push to a
# feat/turnip-* branch takes them from test-build.env, if the branch has one.

on:
  push:
    branches: ['feat/turnip-*']
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa branch or commit, or "pinned" for the one in upstream.json
        default: main
      skip_armada:
        description: Armada base patches to leave out (file names, space-separated)
        default: ""
      variant:
        description: Package name, installed as azimuth-VARIANT
        default: next

jobs:
  turnip:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git gcc gcc-c++ meson ninja-build pkgconf-pkg-config patch curl tar gzip \
            python3 python3-mako python3-pyyaml python3-packaging python3-ply bison flex glslang \
            libdrm-devel expat-devel zlib-devel libzstd-devel \
            wayland-devel wayland-protocols-devel libX11-devel libxcb-devel \
            libxshmfence-devel libXrandr-devel
      - uses: actions/checkout@v5
      - name: Resolve the Mesa commit
        env:
          REF: ${{ inputs.mesa_ref }}
          SKIP: ${{ inputs.skip_armada }}
          VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ -f test-build.env ] || { echo "no test-build.env"; exit 1; }
            source test-build.env
            REF="$MESA_REF" SKIP="$SKIP_ARMADA"
          fi
          echo "SKIP_ARMADA=$SKIP" >> "$GITHUB_ENV"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          if [ "$REF" = pinned ]; then
            exit 0
          elif [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            commit="$REF"
          else
            commit="$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git "refs/heads/$REF" | cut -f1)"
          fi
          test -n "$commit"
          echo "MESA_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "Mesa $REF: $commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the source
        shell: bash
        run: scripts/prepare.sh work 2>&1 | tee prepare.log
      - name: Build
        run: scripts/build.sh work out
      - name: Check the driver
        run: |
          tar -tzf out/azimuth-turnip-$VARIANT-*.tar.gz
          strings work/pkg/azimuth-$VARIANT/libvulkan_freedreno.so | grep -q VK_EXT_external_memory_host
          cat work/pkg/azimuth-$VARIANT/meta.json
          echo "Mesa $(cat work/mesa/VERSION)"
          grep -E '^(Mesa|Armada|Patch):' prepare.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: azimuth-turnip-${{ env.VARIANT }}
          path: out/*.tar.gz

name: Release

# Builds the driver and publishes it as release vVERSION (the VERSION file).
# The package holds only the driver and its test tool, no game files.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  turnip:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git gcc gcc-c++ meson ninja-build pkgconf-pkg-config patch curl tar gzip \
            python3 python3-mako python3-pyyaml python3-packaging bison flex glslang \
            libdrm-devel expat-devel zlib-devel libzstd-devel \
            wayland-devel wayland-protocols-devel libX11-devel libxcb-devel \
            libxshmfence-devel libXrandr-devel
      - uses: actions/checkout@v5
      - name: Build
        run: |
          scripts/prepare.sh work
          scripts/build.sh work out
      - uses: actions/upload-artifact@v4
        with:
          name: azimuth-turnip
          path: out/*.tar.gz

  publish:
    needs: turnip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: azimuth-turnip
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          archive="out/azimuth-turnip-$version.tar.gz"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          mesa="$(python3 -c 'import json; print(json.load(open("upstream.json"))["mesa"]["commit"][:10])')"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Using the driver

          Turnip from ArmadaOS's Devel branch (Mesa $mesa) with the two fixes Forza Horizon 2 needs through Azimuth on the Adreno 740: emulated VK_EXT_external_memory_host and the ir3 fmadz compile fix.

          Have Azimuth set up with your own game files and added to Steam first. Then, in Desktop Mode:

          1. Run scripts/install-armadaos.sh (the README has a curl one-liner). It puts the driver in ~/.local/share/armada/turnip/azimuth and prints the launch options.
          2. In Azimuth > Properties pick Proton Experimental (arm64) and paste those launch options. They point VK_DRIVER_FILES at this driver; choosing it in Armada Control doesn't reach the game.

          Azimuth 1.0.4 runs as is; 1.0.0 to 1.0.2 also need Microsoft's d3dcompiler_47 in the prefix (see the README). The first start compiles Azimuth's pipelines, so give it a minute.

          Driver SHA-256: \`$sha256\`. No game files here.
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Azimuth Turnip for ArmadaOS $version" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi

name: Release

# Builds the driver and publishes it as release vVERSION (the VERSION file).
# The package holds only the driver and its test tool, no game files.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  turnip:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git gcc gcc-c++ meson ninja-build pkgconf-pkg-config patch curl tar gzip \
            python3 python3-mako python3-pyyaml python3-packaging bison flex glslang \
            libdrm-devel expat-devel zlib-devel libzstd-devel \
            wayland-devel wayland-protocols-devel libX11-devel libxcb-devel \
            libxshmfence-devel libXrandr-devel
      - uses: actions/checkout@v5
      - name: Build
        run: |
          scripts/prepare.sh work
          scripts/build.sh work out
      - uses: actions/upload-artifact@v4
        with:
          name: azimuth-turnip
          path: out/*.tar.gz

  publish:
    needs: turnip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: azimuth-turnip
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          archive="out/azimuth-turnip-$version.tar.gz"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          mesa="$(python3 -c 'import json; print(json.load(open("upstream.json"))["mesa"]["commit"][:10])')"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Install

          Turnip (Mesa $mesa, ArmadaOS's Devel driver) with the two fixes Azimuth needs on the Retroid Pocket 6: emulated VK_EXT_external_memory_host and the ir3 fmadz compile fix.

          On ArmadaOS, in Desktop Mode, run scripts/install-armadaos.sh: it installs the driver in ~/.local/share/armada/turnip/azimuth and prints the Steam launch options. Use Proton Experimental (arm64) and set Frame pacing to Real-time in Azimuth's launcher.

          No game files are included. SHA-256: \`$sha256\`
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Azimuth Turnip for ArmadaOS $version" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
